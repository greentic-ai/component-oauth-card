[package]
name = "component-oauth-card"
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "Greentic component component-oauth-card"
repository = "https://github.com/component-oauth-card"
authors = ["maarten"]
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.greentic]
abi_version = "0.6.0"

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[workspace]
members = ["crates/oauth-card-core"]

[dependencies]
oauth-card-core = { path = "crates/oauth-card-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
greentic-types = "0.4"
greentic-interfaces-guest = { version = "0.4", default-features = false, features = ["component-v0-6"] }
ciborium = "0.2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
greentic-types = "0.4"
serde_json = "1"

[dev-dependencies]
serde_json = "1"

# wasm-only: generates the greentic:component@0.6.0 family bindings (the legacy
# node@0.6.0 export still comes from greentic-interfaces-guest's macro).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.54", default-features = false, features = ["macros", "realloc"] }
